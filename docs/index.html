<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibe Coding – COVID-19 dashboards</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #0d1117;
        color: #f0f6fc;
      }
      header {
        padding: 2rem 1.5rem 1rem;
        background: rgba(13, 17, 23, 0.95);
        border-bottom: 1px solid rgba(240, 246, 252, 0.1);
      }
      main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        padding: 2rem 1.5rem 3rem;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
      }
      p {
        margin: 0.75rem 0 0;
        max-width: 60ch;
        color: rgba(240, 246, 252, 0.75);
      }
      a {
        color: #58a6ff;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      li {
        background: rgba(88, 134, 255, 0.08);
        border: 1px solid rgba(88, 134, 255, 0.2);
        border-radius: 12px;
        padding: 1.2rem 1.4rem;
      }
      li strong {
        display: block;
        margin-bottom: 0.2rem;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Vibe Coding – COVID-19 dashboards</h1>
      <p>
        Samlede demopakker til Kortdage 2025. Brug navigationen herunder til at
        åbne de enkelte dashboards.
      </p>
    </header>
    <main>
      <ul>
        <li>
          <strong>Streamlit (stlite)</strong>
          <a href="streamlit.html">Åbn Streamlit-demoen</a>
        </li>
      </ul>
    </main>
  </body>
</html>
